<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LastixParser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#5ab4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="196"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- кольца радара -->
  <g fill="none" stroke="#8b6cff" stroke-opacity=".28" stroke-width="4">
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="136"/>
    <circle cx="256" cy="256" r="76"/>
    <path d="M256 60v392M60 256h392" stroke-opacity=".16"/>
  </g>

  <!-- сектор сканирования -->
  <path d="M256 256 L256 60 A196 196 0 0 1 452 256 Z" fill="url(#sweep)" clip-path="url(#disc)"/>
  <path d="M256 256 L452 256" stroke="#b9a6ff" stroke-width="5" stroke-linecap="round"/>

  <!-- найденные заказы -->
  <circle cx="372" cy="150" r="13" fill="#3ecf8e"/>
  <circle cx="372" cy="150" r="26" fill="none" stroke="#3ecf8e" stroke-opacity=".45" stroke-width="4"/>
  <circle cx="318" cy="198" r="8" fill="#f3b547"/>
  <circle cx="150" cy="352" r="7" fill="#5ab4ff" fill-opacity=".8"/>

  <!-- буква L -->
  <path d="M190 150 V340 H318" fill="none" stroke="url(#ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
